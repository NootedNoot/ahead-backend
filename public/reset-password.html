<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your Ahead password</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #0D0618; color: #E2D9F3; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { width: 100%; max-width: 360px; background: #160D27; border: 1px solid #2A1A4A; border-radius: 20px; padding: 28px; box-sizing: border-box; }
  .eyebrow { margin: 0 0 20px; color: #A78BFA; font-size: 13px; font-weight: bold; letter-spacing: 0.15em; text-transform: uppercase; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p { color: #7C6FA0; font-size: 13px; line-height: 1.5; }
  input { width: 100%; box-sizing: border-box; margin-top: 16px; padding: 12px 14px; background: #0D0618; border: 1px solid #2A1A4A; border-radius: 10px; color: #E2D9F3; font-size: 14px; }
  input:focus { outline: none; border-color: #8B5CF6; }
  button { width: 100%; margin-top: 16px; padding: 12px; background: #8B5CF6; color: #fff; border: none; border-radius: 14px; font-size: 14px; font-weight: bold; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; }
  .msg.error { color: #F87171; }
  .msg.success { color: #34D399; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Ahead</p>
    <div id="form">
      <h1>Choose a new password</h1>
      <p>Must be at least 10 characters. This link only works once.</p>
      <input id="password" type="password" placeholder="New password" autocomplete="new-password">
      <button id="submitBtn">Reset password</button>
    </div>
    <div id="successState" style="display:none;">
      <h1>Password reset</h1>
      <p>You can go back and log in with your new password now.</p>
    </div>
    <div id="msg" class="msg"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const msg = document.getElementById('msg');

  if (!token) {
    document.getElementById('form').style.display = 'none';
    msg.textContent = 'This link is missing its token - open the link from your email again.';
    msg.className = 'msg error';
  }

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const password = document.getElementById('password').value;
    if (password.length < 10) {
      msg.textContent = 'Password must be at least 10 characters.';
      msg.className = 'msg error';
      return;
    }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    msg.textContent = '';
    try {
      const res = await fetch('/api/auth/password-reset/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      document.getElementById('form').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg error';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
