<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify your Ahead email</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #0D0618; color: #E2D9F3; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { width: 100%; max-width: 360px; background: #160D27; border: 1px solid #2A1A4A; border-radius: 20px; padding: 28px; box-sizing: border-box; }
  .eyebrow { margin: 0 0 20px; color: #A78BFA; font-size: 13px; font-weight: bold; letter-spacing: 0.15em; text-transform: uppercase; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p { color: #7C6FA0; font-size: 13px; line-height: 1.5; }
  button { width: 100%; margin-top: 20px; padding: 12px; background: #8B5CF6; color: #fff; border: none; border-radius: 14px; font-size: 14px; font-weight: bold; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; }
  .msg.error { color: #F87171; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Ahead</p>
    <!-- Deliberately NOT auto-confirmed on page load - email clients and
         corporate link scanners (Outlook Safe Links, Gmail prefetch) GET
         this page automatically to scan it, which would silently burn a
         single-use token before the real person ever sees it. Confirming
         only happens on an explicit button click (a POST), never on the
         page's own GET. -->
    <div id="promptState">
      <h1>Verify your email</h1>
      <p>Confirming this address lets other people safely share their glucose data with your account.</p>
      <button id="confirmBtn">Verify email</button>
    </div>
    <div id="successState" style="display:none;">
      <h1>Email verified</h1>
      <p>You're all set - you can close this page.</p>
    </div>
    <div id="msg" class="msg"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const msg = document.getElementById('msg');

  if (!token) {
    document.getElementById('promptState').style.display = 'none';
    msg.textContent = 'This link is missing its token - open the link from your email again.';
    msg.className = 'msg error';
  }

  document.getElementById('confirmBtn').addEventListener('click', async () => {
    const btn = document.getElementById('confirmBtn');
    btn.disabled = true;
    msg.textContent = '';
    try {
      const res = await fetch('/api/auth/verify-email/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      document.getElementById('promptState').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg error';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
